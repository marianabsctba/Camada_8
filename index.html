<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camada 8</title>
    <meta name="description" content="Jogo para aprender redes de computadores de verdade, da crimpagem do cabo ao certificado TLS." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230b1016'/%3E%3Crect x='7' y='9' width='18' height='14' rx='2' fill='none' stroke='%23ff7a1a' stroke-width='2.5'/%3E%3Crect x='11' y='23' width='10' height='4' fill='%23ff7a1a'/%3E%3Ccircle cx='25' cy='7' r='3' fill='%233ddc84'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500&family=Saira+Condensed:wght@500;700;800&display=swap" rel="stylesheet" />
    <script>
      // se algo falhar antes da capa aparecer, diga na tela em vez de ficar parado
      (function () {
        function avisar(msg) {
          var app = document.getElementById('app');
          if (!app || document.querySelector('main')) return;
          app.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1016;color:#c9d3dc;font-family:system-ui,sans-serif;padding:16px;text-align:center"><div style="font-size:32px;font-weight:800">CAMADA <span style="color:#ff7a1a">8</span></div><div>O jogo não conseguiu abrir. Aperte Ctrl+F5 para buscar a versão nova.</div><code style="color:#ff5d5d;font-size:12px"></code></div>';
          app.querySelector('code').textContent = msg;
        }
        window.addEventListener('error', function (e) { avisar(String(e.message || (e.target && e.target.src) || 'erro')); }, true);
        window.addEventListener('unhandledrejection', function (e) { avisar(String(e.reason && e.reason.message || e.reason)); });
      })();
    </script>
  </head>
  <body style="margin:0;background:#0b1016">
    <div id="app">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0b1016;color:#c9d3dc;font-family:system-ui,sans-serif">
        <div style="font-size:44px;font-weight:800;letter-spacing:2px">CAMADA <span style="color:#ff7a1a">8</span></div>
        <div>Carregando o jogo...</div>
        <noscript>O jogo precisa de JavaScript ligado no navegador.</noscript>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
